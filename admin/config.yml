# Admin panel configuration (Sveltia CMS).
# Your edits in /admin are saved as commits to this GitHub repository,
# and GitHub Pages republishes the site automatically.

backend:
  name: github
  repo: ruchii-prasad/ruchii-prasad.github.io
  branch: main

site_url: https://ruchii-prasad.github.io
display_url: https://ruchii-prasad.github.io

# PDFs and other files you upload (papers, résumé) are stored here.
media_folder: uploads
public_folder: /uploads

collections:
  - name: website
    label: Website
    editor:
      preview: false
    files:

      # ---------------- PROFILE ----------------
      - name: profile
        label: Profile & links
        file: content/profile.json
        format: json
        fields:
          - { name: name, label: Name, widget: string }
          - { name: role, label: Headline, widget: string, required: false, hint: "Shown under your name" }
          - { name: bio, label: Short bio, widget: text, required: false }
          - { name: email, label: Email, widget: string, required: false }
          - { name: github, label: GitHub URL, widget: string, required: false }
          - { name: linkedin, label: LinkedIn URL, widget: string, required: false }
          - { name: resume, label: Résumé (PDF), widget: file, required: false, hint: "Upload a PDF to show a Résumé button" }

      # ---------------- PROJECTS ----------------
      - name: projects
        label: Projects
        file: content/projects.json
        format: json
        fields:
          - name: items
            label: Projects
            label_singular: Project
            widget: list
            summary: "{{fields.title}}"
            hint: "Drag to reorder — newest or most important first"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: status, label: Status, widget: string, required: false, hint: "e.g. In progress — leave empty when finished" }
              - { name: date, label: Date, widget: string, required: false, hint: "e.g. 2026 or 2026 – present" }
              - { name: sub, label: Subtitle, widget: string, required: false, hint: "e.g. competition, course, or organisation" }
              - { name: desc, label: Description, widget: text, required: false }
              - { name: tags, label: Tags, widget: list, required: false, hint: "Comma-separated, e.g. C++, FPGA" }
              - { name: code, label: Code link (GitHub repo), widget: string, required: false }
              - { name: link, label: Demo / write-up link, widget: string, required: false }

      # ---------------- ACHIEVEMENTS ----------------
      - name: achievements
        label: Achievements
        file: content/achievements.json
        format: json
        fields:
          - name: items
            label: Achievements
            label_singular: Achievement
            widget: list
            summary: "{{fields.title}}"
            hint: "Hidden on the site until you add the first one"
            fields:
              - { name: title, label: Title, widget: string, hint: "e.g. Finalist, IMC Prosperity" }
              - { name: date, label: Date, widget: string, required: false }
              - { name: desc, label: One-line description, widget: string, required: false }
              - { name: link, label: Link, widget: string, required: false }

      # ---------------- RESEARCH ----------------
      - name: research
        label: Research papers
        file: content/research.json
        format: json
        fields:
          - name: items
            label: Papers
            label_singular: Paper
            widget: list
            summary: "{{fields.title}}"
            hint: "Hidden on the site until you add the first one"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: authors, label: Authors, widget: list, required: false, hint: "In order, comma-separated. Leave empty if it's only you." }
              - { name: date, label: Date, widget: string, required: false, hint: "e.g. 2027 — the year is used in citations" }
              - { name: sub, label: Venue / status, widget: string, required: false, hint: "e.g. Working paper, Preprint, or journal name" }
              - { name: desc, label: One- or two-sentence summary, widget: text, required: false }
              - { name: abstract, label: Abstract, widget: text, required: false }
              - { name: pdf, label: Paper PDF, widget: file, required: false }
              - { name: link, label: DOI or journal link, widget: string, required: false, hint: "e.g. https://doi.org/10.5281/zenodo.123 — used in citations" }
              - { name: tags, label: Tags, widget: list, required: false }

      # ---------------- EXPERIENCE ----------------
      - name: experience
        label: Experience
        file: content/experience.json
        format: json
        fields:
          - name: items
            label: Experience
            label_singular: Position
            widget: list
            summary: "{{fields.title}} — {{fields.sub}}"
            hint: "Internships and positions. Hidden until you add the first one."
            fields:
              - { name: title, label: Role, widget: string }
              - { name: sub, label: Organisation, widget: string, required: false }
              - { name: date, label: Dates, widget: string, required: false }
              - { name: desc, label: What you did, widget: text, required: false }
              - { name: tags, label: Tags, widget: list, required: false }

      # ---------------- EDUCATION & SKILLS ----------------
      - name: education
        label: Education & skills
        file: content/education.json
        format: json
        fields:
          - name: items
            label: Education
            label_singular: Degree
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Degree, widget: string }
              - { name: date, label: Dates, widget: string, required: false }
              - { name: sub, label: Institution, widget: string, required: false }
              - { name: desc, label: Details, widget: text, required: false }
          - name: skills
            label: Skills
            label_singular: Skill group
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: Group, widget: string, hint: "e.g. Languages" }
              - { name: value, label: Skills, widget: string, hint: "e.g. C, C++, Python, Verilog" }

      # ---------------- SETTINGS ----------------
      - name: settings
        label: Settings
        file: content/settings.json
        format: json
        fields:
          - { name: contact_form_key, label: Contact form access key (Web3Forms), widget: string, required: false, hint: "From web3forms.com. Leave empty to hide the contact form." }
          - { name: goatcounter_code, label: Analytics code (GoatCounter), widget: string, required: false, hint: "Just the code — e.g. ruchi for ruchi.goatcounter.com. Leave empty to turn analytics off." }
